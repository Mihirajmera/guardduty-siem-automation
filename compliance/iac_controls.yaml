# Checkov check -> NIST SP 800-53 Rev. 5 and CIS AWS Foundations Benchmark v3.0.0.
# Mappings are my own judgment, kept deliberately narrow: a CIS ID is listed only where the
# check tests the same thing as the benchmark recommendation. Checks not listed are reported
# as "unmapped".
